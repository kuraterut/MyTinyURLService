server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/tinyurl
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/migration/changelog-master.xml

application:
  base-url: http://localhost:8080/
  tiny-url-length: 6